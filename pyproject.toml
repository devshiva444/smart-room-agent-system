[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SmartRoom-Swarm-OS"
version = "1.0.0"
description = "Autonomous Workspace OS with Multi-Agent Swarm and Security Sentinel"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.27.0",
    "pydantic==2.6.0",
    "python-dotenv>=1.1.0",
    "torch",
    "numpy==1.26.4",
    "requests==2.31.0",
    "openai==2.30.0",
    "Jinja2==3.1.2"
]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
where = ["."]